name: Crear APK de Mama
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias esenciales de Linux
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev build-essential libstdc++6 aidl wget
          pip install --upgrade pip
          pip install buildozer cython kivy yt-dlp

      - name: Engañar a Buildozer instalando el SDK en la ruta vieja (Solucion Definitiva)
        run: |
          # 1. Creamos a la fuerza tanto la carpeta moderna como la carpeta vieja que exige Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # 2. Descargamos las herramientas oficiales directamente de los servidores de Google
          wget -q https://google.com -O cmdline.zip
          
          # 3. Descomprimimos los comandos reales de Android
          unzip -q cmdline.zip
          mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools cmdline.zip
          
          # 4. TRUCO DE INGENIERÍA: Creamos un puente directo (enlace) desde la carpeta vieja hacia la nueva
          # De esta forma, cuando Buildozer busque en 'tools/bin/sdkmanager', el sistema lo desviará al archivo real
          ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          # 5. Creamos la firma digital de las licencias para que no pida confirmacion en pantalla
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "244d242542139071222304531819a3217b152345\n284a16438b9d7b63ea985a2dbe62fb0c72133124\n7c30d64b34d36a0c516119b3149a0e2a3113c29f" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Generar configuracion de la App
        run: |
          buildozer init
          sed -i 's/requirements = .*/requirements = python3,kivy,yt_dlp/g' buildozer.spec
          sed -i 's/#?android.permissions = .*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/g' buildozer.spec

      - name: Fabricar APK con Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Ahora Buildozer encontrará el puente creado en 'tools/bin' y compilará de largo
          buildozer -v android debug

      - name: Guardar el archivo APK listo
        uses: actions/upload-artifact@v4
        with:
          name: App_Mama_Instalable
          path: bin/*.apk
