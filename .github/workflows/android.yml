name: Crear APK de Mama
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev build-essential libstdc++6 aidl
          pip install --upgrade pip
          pip install buildozer cython kivy yt-dlp

      - name: Generar configuracion limpia
        run: |
          buildozer init
          sed -i 's/requirements = .*/requirements = python3,kivy,yt_dlp/g' buildozer.spec
          sed -i 's/#?android.permissions = .*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/g' buildozer.spec

      - name: Forzar instalacion de herramientas y aceptar licencias (Solucion SDK)
        run: |
          # Creamos y preparamos las rutas del SDK antes de lanzar Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # Forzamos la descarga nativa e inyectamos la aprobacion de contratos de Google
          yes | buildozer android licenses || true

      - name: Fabricar APK con Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Forzamos a Buildozer a descargar el empaquetador correcto
          buildozer -v android debug

      - name: Guardar el archivo APK listo
        uses: actions/upload-artifact@v4
        with:
          name: App_Mama_Instalable
          path: bin/*.apk
